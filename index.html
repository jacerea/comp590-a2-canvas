<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>COMP 590 - Assignment 3</title>
  <style>
    body { margin: 0; background: #1a1a2e; display: flex;
           justify-content: center; align-items: center; height: 100vh; }
    /* size the canvas with the width/height attributes, not css.
       css sizing just stretches the pixels and looks blurry */
    canvas { background: #0f3460; border: 1px solid #444; cursor: crosshair; }
  </style>
</head>
<body>
  <canvas id="scene" width="800" height="600"></canvas>

  <script>
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');

  // node is one piece of a hierarchical object. its transform is
  // relative to its parent, so children inherit whatever the parent
  // already applied. basically a Transform component from unity.
  class Node {
    constructor(options = {}) {
      this.x = options.x ?? 0;
      this.y = options.y ?? 0;
      this.rotation = options.rotation ?? 0;

      // separate x and y scale so a node can squash instead of just resize
      this.scaleX = options.scaleX ?? options.scale ?? 1;
      this.scaleY = options.scaleY ?? options.scale ?? 1;

      this.children = [];

      // draws this node in its own local space, so it can assume it's
      // sitting at the origin with no rotation
      this.render = options.render ?? null;

      // per node animation, runs once a frame
      this.behavior = options.behavior ?? null;
    }

    // returns the child so i can keep a reference while building the tree
    add(child) {
      this.children.push(child);
      return child;
    }

    update(dt, elapsed) {
      if (this.behavior) this.behavior(this, dt, elapsed);
      for (const child of this.children) child.update(dt, elapsed);
    }

    draw(ctx) {
      // push the current transform so everything below can be undone
      ctx.save();

      // order matters here. rotating first would swing the translation
      // around with it
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotation);
      ctx.scale(this.scaleX, this.scaleY);

      if (this.render) this.render(ctx);

      // children draw inside this transform, so their coords are
      // relative to this node. that's the whole hierarchy trick
      for (const child of this.children) child.draw(ctx);

      // pop back to the parent's transform. every save needs exactly one
      // restore or the stack drifts and the scene warps
      ctx.restore();
    }
  }


  // dome with a scalloped rim. origin is at the center of the rim so the
  // bell scales outward from there when it pulses
  function drawBell(ctx) {
    ctx.fillStyle = 'rgba(180, 130, 255, 0.75)';
    ctx.beginPath();
    ctx.moveTo(-48, 0);
    ctx.bezierCurveTo(-52, -58, 52, -58, 48, 0);
    ctx.quadraticCurveTo(34, 14, 16, 0);
    ctx.quadraticCurveTo(0, 14, -16, 0);
    ctx.quadraticCurveTo(-34, 14, -48, 0);
    ctx.closePath();
    ctx.fill();

    // smaller brighter dome inside for a bit of depth
    ctx.fillStyle = 'rgba(226, 190, 255, 0.55)';
    ctx.beginPath();
    ctx.ellipse(-10, -26, 18, 13, -0.4, 0, Math.PI * 2);
    ctx.fill();
  }

  // one tentacle segment. origin is at its top joint, tapers downward.
  // w is the width at the joint, len is how far it hangs
  function drawTentacle(ctx, w, len, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-w, 0);
    ctx.lineTo(w, 0);
    ctx.lineTo(w * 0.55, len);
    ctx.lineTo(-w * 0.55, len);
    ctx.closePath();
    ctx.fill();
  }


  // builds one jellyfish. the tree is a body with five tentacles hanging
  // off it, each tentacle being a chain of three segments, plus the bell.
  // everything runs off one pulse wave. each segment lags the one above
  // it, so motion travels down the chain instead of the whole thing
  // swinging like a rigid block.
  // speed is px per second sideways, pulseRate is radians per second, and
  // phase desyncs each jellyfish from the others
  function makeCreature(config = {}) {
    const baseY     = config.y ?? 300;
    const speed     = config.speed ?? 45;
    const pulseRate = config.pulseRate ?? 2.2;
    const phase     = config.phase ?? 0;
    const size      = config.scale ?? 1;

    const jelly = new Node({
      x: config.x ?? 400,
      y: baseY,
      scale: size,
      behavior: (node, dt, elapsed) => {
        node.x += node.speed * dt;

        // wrap once it's fully off the right edge. scaled by size so the
        // big ones don't clip while they're still visible
        if (node.x - 140 * node.scaleX > canvas.width) {
          node.x = -140 * node.scaleX;
        }

        // rises on the contraction, sinks between pulses. jellyfish move
        // by squeezing water out of the bell
        node.y = node.baseY + Math.sin(elapsed * pulseRate + phase) * 16;
      }
    });

    /*
    //ASSIGNEMENT 3 UPDATE: baseY and speed live on the node now instead of
     being trapped in closure variables. respawn needs to change them at
     runtime when a shot jellyfish comes back with new traits
    */
    jelly.baseY = baseY;
    jelly.speed = speed;

    // tentacles go first so they end up behind the bell. draw order is
    // depth, a 2d canvas has no z buffer
    const anchors = [-32, -16, 0, 16, 32];

    anchors.forEach((ax, i) => {
      // outer tentacles sway more than the middle ones
      const amp = 0.18 + Math.abs(ax) / 32 * 0.16;

      // the i * 0.35 offset staggers the tentacles so they don't sway as
      // one slab
      const upper = jelly.add(new Node({
        x: ax, y: 2,
        render: (ctx) => drawTentacle(ctx, 7, 40, 'rgba(160, 110, 235, 0.65)'),
        behavior: (node, dt, elapsed) => {
          node.rotation = Math.sin(elapsed * pulseRate + phase + i * 0.35) * amp;
        }
      }));

      // the 0.6 lag means this segment reacts late to the one above it,
      // which is what makes the motion look like it's traveling
      const mid = upper.add(new Node({
        x: 0, y: 38,
        render: (ctx) => drawTentacle(ctx, 4.5, 36, 'rgba(150, 100, 225, 0.55)'),
        behavior: (node, dt, elapsed) => {
          node.rotation = Math.sin(elapsed * pulseRate + phase + i * 0.35 - 0.6) * amp * 1.4;
        }
      }));

      // lags even further and swings widest since it's the loose tip
      mid.add(new Node({
        x: 0, y: 34,
        render: (ctx) => drawTentacle(ctx, 2.8, 32, 'rgba(140, 95, 215, 0.45)'),
        behavior: (node, dt, elapsed) => {
          node.rotation = Math.sin(elapsed * pulseRate + phase + i * 0.35 - 1.2) * amp * 1.8;
        }
      }));
    });

    // bell goes last so it sits in front of the tentacles. squash and
    // stretch, widening as it flattens keeps the apparent volume the same
    // so it reads as a muscle instead of the shape just growing
    jelly.add(new Node({
      x: 0, y: 0,
      render: drawBell,
      behavior: (node, dt, elapsed) => {
        const p = Math.sin(elapsed * pulseRate + phase);
        node.scaleX = 1 + p * 0.10;
        node.scaleY = 1 - p * 0.13;
      }
    }));

    //Assignment 3 Update: these two got declared in assignment 2 but nothing read them. the shooting mechanic uses them now
    jelly.points = config.points ?? 10;
    jelly.alive = true;

    return jelly;
  }


  // one seaweed segment. origin is at its bottom joint and it grows
  // upward into negative y, tapering as it goes
  function drawFrond(ctx, w, len, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-w, 0);
    ctx.lineTo(w, 0);
    ctx.lineTo(w * 0.6, -len);
    ctx.lineTo(-w * 0.6, -len);
    ctx.closePath();
    ctx.fill();
  }

  // a seaweed stalk, built as a chain where each link is parented to the
  // one below it. same lag idea as the tentacles, except the sway starts
  // at the base and travels up, so the tip whips furthest and latest
  function makeSeaweed(config = {}) {
    const swayRate = config.swayRate ?? 0.9;
    const phase    = config.phase ?? 0;
    const links    = config.links ?? 4;

    const base = new Node({
      x: config.x ?? 400,
      y: canvas.height,
      scale: config.scale ?? 1
    });

    let parent = base;
    let width = 8;
    let length = 46;

    for (let i = 0; i < links; i++) {
      // fades and narrows toward the tip
      const shade = `rgba(45, ${130 - i * 12}, ${105 - i * 8}, ${0.85 - i * 0.09})`;
      const w = width, len = length;

      // the root sits on the seabed and every other link sits on top of
      // its parent. amplitude grows with height and each link lags the
      // one below, so the stalk ripples instead of pivoting as one piece
      const seg = parent.add(new Node({
        y: i === 0 ? 0 : -length * 1.18,
        render: (ctx) => drawFrond(ctx, w, len, shade),
        behavior: (node, dt, elapsed) => {
          const amp = 0.07 + i * 0.06;
          node.rotation = Math.sin(elapsed * swayRate + phase - i * 0.45) * amp;
        }
      }));

      parent = seg;
      width *= 0.78;
      length *= 0.88;
    }

    return base;
  }

  // static coral clump, just a fan of stubby branches off a shared base.
  // left unanimated on purpose since coral is rigid, and having something
  // still gives the eye a reference for the moving stuff
  function makeCoral(config = {}) {
    const color = config.color ?? 'rgba(230, 110, 140, 0.8)';

    return new Node({
      x: config.x ?? 400,
      y: canvas.height,
      scale: config.scale ?? 1,
      render: (ctx) => {
        ctx.fillStyle = color;

        // branch angles in radians off vertical
        const branches = [-0.75, -0.35, 0, 0.35, 0.75];

        for (const angle of branches) {
          ctx.save();
          ctx.rotate(angle);

          // outer branches come out shorter
          const len = 34 + Math.abs(angle) * -18;
          ctx.beginPath();
          ctx.moveTo(-5, 0);
          ctx.lineTo(5, 0);
          ctx.lineTo(2.5, -len);
          ctx.lineTo(-2.5, -len);
          ctx.closePath();
          ctx.fill();

          // rounded tip
          ctx.beginPath();
          ctx.arc(0, -len, 3.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }
      }
    });
  }

  // seabed silhouette that sits behind everything on the floor
  function drawSeabed(ctx) {
    ctx.fillStyle = 'rgba(12, 38, 74, 0.9)';
    ctx.beginPath();
    ctx.moveTo(0, canvas.height);
    ctx.lineTo(0, canvas.height - 28);
    ctx.quadraticCurveTo(140, canvas.height - 58, 300, canvas.height - 34);
    ctx.quadraticCurveTo(470, canvas.height - 12, 620, canvas.height - 44);
    ctx.quadraticCurveTo(720, canvas.height - 64, canvas.width, canvas.height - 30);
    ctx.lineTo(canvas.width, canvas.height);
    ctx.closePath();
    ctx.fill();
  }

  /*
  //ASSIGNEMENT 3 UPDATE: hud. this is the view half of mvc, reading game
   state without ever writing to it. drawn last so it sits on top of
   everything else in the scene
  */
  function drawHud(ctx) {
    ctx.save();

    ctx.font = 'bold 22px Helvetica, Arial, sans-serif';
    ctx.fillStyle = 'rgba(226, 240, 255, 0.92)';
    ctx.textBaseline = 'top';

    ctx.textAlign = 'left';
    ctx.fillText('Score: ' + game.score, 16, 14);

    // the clock turns red in the last ten seconds
    ctx.textAlign = 'right';
    ctx.fillStyle = game.timeLeft <= 10
      ? 'rgba(255, 120, 140, 0.95)'
      : 'rgba(226, 240, 255, 0.92)';
    ctx.fillText('Time: ' + Math.ceil(game.timeLeft), canvas.width - 16, 14);

    if (game.over) {
      // dim the whole scene so the end card reads clearly
      ctx.fillStyle = 'rgba(8, 20, 42, 0.72)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(232, 244, 255, 0.95)';

      ctx.font = 'bold 44px Helvetica, Arial, sans-serif';
      ctx.fillText('Time!', canvas.width / 2, canvas.height / 2 - 70);

      ctx.font = 'bold 30px Helvetica, Arial, sans-serif';
      ctx.fillText('Final score: ' + game.score, canvas.width / 2, canvas.height / 2 - 10);

      ctx.font = '19px Helvetica, Arial, sans-serif';
      ctx.fillStyle = 'rgba(200, 220, 245, 0.8)';
      ctx.fillText('press R to play again', canvas.width / 2, canvas.height / 2 + 40);
    }

    ctx.restore();
  }


  // floating particles. these are plain objects instead of nodes since
  // they have no parts, so a hierarchy would be overkill. just enough
  // motion to keep the water from feeling empty
  const particles = [];

  for (let i = 0; i < 45; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: 1 + Math.random() * 2.5,
      speed: 4 + Math.random() * 14,
      swayAmp: 6 + Math.random() * 14,
      swayRate: 0.3 + Math.random() * 0.6,
      phase: Math.random() * Math.PI * 2,
      alpha: 0.12 + Math.random() * 0.25
    });
  }

  function updateParticles(dt) {
    for (const p of particles) {
      p.y -= p.speed * dt;

      // recycle back to the bottom once it clears the top
      if (p.y < -5) {
        p.y = canvas.height + 5;
        p.x = Math.random() * canvas.width;
      }
    }
  }

  function drawParticles(elapsed) {
    for (const p of particles) {
      // sway gets computed here from elapsed instead of being stored, so
      // it costs no state and can't accumulate drift over a long run
      const x = p.x + Math.sin(elapsed * p.swayRate + p.phase) * p.swayAmp;

      ctx.fillStyle = `rgba(200, 225, 255, ${p.alpha})`;
      ctx.beginPath();
      ctx.arc(x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
    }
  }


  // the seabed layer, a mix of swaying seaweed and static coral
  const seabed = [
    makeSeaweed({ x:  40, scale: 1.0,  swayRate: 0.8,  phase: 0.0, links: 5 }),
    makeCoral  ({ x: 110, scale: 0.9,  color: 'rgba(228, 105, 135, 0.75)' }),
    makeSeaweed({ x: 175, scale: 0.75, swayRate: 1.1,  phase: 2.1, links: 4 }),
    makeSeaweed({ x: 215, scale: 1.15, swayRate: 0.7,  phase: 3.6, links: 5 }),
    makeCoral  ({ x: 330, scale: 0.65, color: 'rgba(240, 165, 95, 0.7)'  }),
    makeSeaweed({ x: 395, scale: 0.9,  swayRate: 0.95, phase: 1.2, links: 4 }),
    makeSeaweed({ x: 445, scale: 1.05, swayRate: 0.75, phase: 4.4, links: 5 }),
    makeCoral  ({ x: 560, scale: 1.0,  color: 'rgba(215, 120, 190, 0.72)' }),
    makeSeaweed({ x: 625, scale: 0.8,  swayRate: 1.05, phase: 0.6, links: 4 }),
    makeSeaweed({ x: 690, scale: 1.1,  swayRate: 0.85, phase: 2.8, links: 5 }),
    makeCoral  ({ x: 755, scale: 0.75, color: 'rgba(235, 130, 120, 0.7)' })
  ];

  // varying size, speed, depth and pulse rate keeps the jellyfish from
  // looking like copies of each other. smaller and faster reads as
  // further away, and is worth more points
  const scene = [
    makeCreature({ x:  60, y: 140, scale: 0.55, speed: 78, pulseRate: 3.1, phase: 0.0, points: 30 }),
    makeCreature({ x: 320, y: 230, scale: 0.75, speed: 58, pulseRate: 2.5, phase: 1.7, points: 20 }),
    makeCreature({ x: 640, y: 130, scale: 0.45, speed: 95, pulseRate: 3.6, phase: 3.2, points: 40 }),
    makeCreature({ x: 180, y: 380, scale: 1.15, speed: 34, pulseRate: 1.8, phase: 2.4, points: 10 }),
    makeCreature({ x: 520, y: 440, scale: 0.95, speed: 44, pulseRate: 2.1, phase: 0.9, points: 15 }),
    makeCreature({ x: 720, y: 330, scale: 0.65, speed: 66, pulseRate: 2.8, phase: 4.1, points: 25 })
  ];

  /*
  //ASSIGNEMENT 3 UPDATE: game state. this is the model half of mvc, kept
   apart from both the input handler that writes to it and the draw code
   that reads it
  */
  const game = {
    score: 0,
    timeLeft: 45,
    over: false
  };

  /*
  //ASSIGNEMENT 3 UPDATE: send a shot jellyfish back to the left edge with
   fresh randomized traits, so the tank refills and no two rounds play the
   same. respawning instead of deleting also means the scene array never
   changes length, which keeps the update loop simple
  */
  function respawn(jelly) {
    const size = 0.45 + Math.random() * 0.7;

    jelly.scaleX = size;
    jelly.scaleY = size;
    jelly.x = -140 * size;
    jelly.baseY = 110 + Math.random() * 330;
    jelly.speed = 100 - size * 50;          // smaller ones move faster

    // points scale inversely with size, so the hard targets pay more
    jelly.points = Math.round((1.3 - size) * 45);
    jelly.alive = true;
  }

    // assignment 3: input. this is the controller half of mvc. the listener
  // fires on its own schedule, totally independent of the game loop,
  // which is what event driven means
  canvas.addEventListener('mousedown', (event) => {
    //ASSIGNEMENT 3 UPDATE: clicks stop counting once the round ends
    if (game.over) return;

    // clientX and clientY are relative to the browser viewport, not the
    // canvas, so the canvas position has to be subtracted out. the extra
    // scale factor handles the case where css display size differs from
    // the canvas resolution
    const rect = canvas.getBoundingClientRect();
    const mx = (event.clientX - rect.left) * (canvas.width / rect.width);
    const my = (event.clientY - rect.top) * (canvas.height / rect.height);

    // iterate backwards so the check runs front to back. the scene array
    // draws in order, so the last one drawn is on top and should be the
    // one that gets hit when two overlap
    for (let i = scene.length - 1; i >= 0; i--) {
      const jelly = scene[i];
      if (!jelly.alive) continue;

      // the bell sits at the jellyfish's origin, so a circle around that
      // point is a close enough hitbox. radius scales with the creature
      const dx = mx - jelly.x;
      const dy = my - (jelly.y - 22 * jelly.scaleX);
      const radius = 52 * jelly.scaleX;

      // compare squared distances to skip the square root
      if (dx * dx + dy * dy <= radius * radius) {
        //ASSIGNEMENT 3 UPDATE: bank the points, then recycle it back in
        game.score += jelly.points;
        respawn(jelly);
        break;   // one click kills at most one jellyfish
      }
    }
  });

  /*
  //ASSIGNEMENT 3 UPDATE: second event listener, this one on the keyboard.
   R resets the round. keydown goes on window rather than the canvas
   because a canvas element can't hold keyboard focus on its own
  */
  window.addEventListener('keydown', (event) => {
    if (event.key === 'r' || event.key === 'R') {
      game.score = 0;
      game.timeLeft = 45;
      game.over = false;
      for (const jelly of scene) respawn(jelly);
    }
  });


  function update(dt, elapsed) {
    /*
    //ASSIGNEMENT 3 UPDATE: the round clock runs on simulation steps, not
     wall clock, so 45 seconds of game time is exactly the same length of
     round regardless of what the frame rate is doing
    */
    if (!game.over) {
      game.timeLeft -= dt;
      if (game.timeLeft <= 0) {
        game.timeLeft = 0;
        game.over = true;
      }
    }

    updateParticles(dt);
    for (const node of seabed) node.update(dt, elapsed);
    for (const node of scene) node.update(dt, elapsed);
  }

  function draw(elapsed) {
    // canvas doesn't clear itself, without this every old frame stays painted
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // painter's order, back to front
    drawParticles(elapsed);
    drawSeabed(ctx);
    for (const node of seabed) node.draw(ctx);
        for (const node of scene) {
      //Assignment 3: skip anything that's been shot duh.
      if (node.alive) node.draw(ctx);
    }

    //ASSIGNEMENT 3 UPDATE: hud goes last so nothing paints over it
    drawHud(ctx);
  }


  /*
  //ASSIGNEMENT 3 UPDATE: fixed timestep, variable rendering.
   assignment 2 ran one update per frame sized to however long that
   frame took, so no two runs produced the same numbers. now the
   simulation only ever advances in STEP sized chunks. update always
   receives the same value, so every sine wave in the scene hits the
   same result on the same tick no matter what the frame rate does.
   rendering still happens once per frame whenever the browser is ready,
   which is the variable rendering half
  */
  const STEP = 1 / 60;

  //ASSIGNEMENT 3 UPDATE: real time waiting to be spent on simulation steps
  let accumulator = 0;
  let lastTime = 0;

  //ASSIGNEMENT 3 UPDATE: simulated seconds counted in whole steps instead of
  // wall clock. replaces the elapsed variable from assignment 2 and is
  // what drives every animation in the scene
  let simTime = 0;

  //ASSIGNEMENT 3 UPDATE: counters for the determinism check in the console
  let tickCount = 0;
  let frameCount = 0;
  const DEBUG = true;

  function frame(timestamp) {
    const realElapsed = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    accumulator += realElapsed;

    /*
    //ASSIGNEMENT 3 UPDATE: guard against the spiral of death. if the tab sat in
     the background for 30 seconds the accumulator would hold 1800
     pending steps, and running them would take longer than a frame,
     which makes the next accumulator even bigger and locks the page up.
     capping it drops the missed time instead
    */
    if (accumulator > 0.25) accumulator = 0.25;

    //ASSIGNEMENT 3 UPDATE: spend the accumulated time in exact fixed increments a slow frame runs this several times, a fast one runs it zero times
    while (accumulator >= STEP) {
      update(STEP, simTime);
      simTime += STEP;
      accumulator -= STEP;

      //ASSIGNMENT 3 UPDATE: proof of determinism. these print identical values on every refresh because update never sees anything but STEP
      if (DEBUG && tickCount < 12) console.log('jelly.x: ' + scene[0].x);
      tickCount++;
    }

    //ASSIGNEMENT 3 UPDATE: draw runs once per frame no matter how many simulation steps just happened
    draw(simTime);

    if (DEBUG && frameCount < 6) console.log('frame: ' + (frameCount + 1));
    frameCount++;

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
  </script>
</body>
</html>
